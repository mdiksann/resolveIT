name: resolveit
services:
  app:
    build: .
    ports:
      - '127.0.0.1:${APP_PORT:-8000}:80'
    env_file: .env
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      LOG_CHANNEL: stderr
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - app-storage:/var/www/html/storage
  postgres:
    image: postgres:17-bookworm
    environment:
      POSTGRES_DB: ${DB_DATABASE:-resolveit}
      POSTGRES_USER: ${DB_USERNAME:-resolveit}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    ports:
      - '127.0.0.1:${DB_FORWARD_PORT:-5432}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB']
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  app-storage:
  postgres-data:
